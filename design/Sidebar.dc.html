<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:232px;height:100%;min-height:820px;display:flex;flex-direction:column;background:var(--color-bg);border-right:2px solid var(--color-divider);font-family:var(--font-body);color:var(--color-text)">
<div style="padding:20px;display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--color-divider)">
<div style="width:44px;height:44px;flex:none;background:var(--ev);color:#fff;display:flex;align-items:flex-end;padding:5px;font-weight:800;font-size:15px;line-height:1">AD</div>
<div style="min-width:0"><div style="font-weight:800;font-size:14px;line-height:1.2">Jornadas de Diseño AD 2026</div><div style="font-size:12px;color:var(--color-neutral-700)">27–30 oct 2026</div></div>
</div>
<nav style="display:flex;flex-direction:column;padding:12px 0;flex:1">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 20px;background:var(--ev);color:#fff;font-weight:800;font-size:14px;display:flex;justify-content:space-between"><span>{{ it.label }}</span><span>{{ it.n }}</span></div></sc-if>
<sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><div style="padding:10px 20px;font-size:14px;display:flex;justify-content:space-between;cursor:pointer" style-hover="background:var(--ev-100)"><span>{{ it.label }}</span><span style="color:var(--color-neutral-600)">{{ it.n }}</span></div></sc-if>
</sc-for>
</nav>
<div style="padding:16px 20px;border-top:2px solid var(--color-divider);display:flex;flex-direction:column;gap:2px">
<div style="font-size:12px;color:var(--color-neutral-700)">← Mis eventos</div>
<div style="font-size:14px;font-weight:800">Andrea Molina</div>
<div style="font-size:12px;color:var(--color-neutral-700)">Creadora del evento</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:820},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Resumen&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Resumen';
    const L = [['Resumen',''],['Programa','20'],['Calendario',''],['Participantes','214'],['Pagos',''],['Paquetes','4'],['Administradores','3'],['Ajustes del evento','']];
    return { items: L.map(([label, n]) => ({ label, n, on: label === a, off: label !== a })) };
  }
}
</script>
</body>
</html>
